<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B141A">
<title>EKK CHAT</title>
<style>
:root{
  --brand:#00A884;--bg:#0B141A;--panel:#111B21;--panel-2:#202C33;--panel-3:#2A3942;
  --text:#E9EDEF;--text-2:#8696A0;--border:#222D34;
  --bubble-out:#005C4B;--bubble-in:#202C33;--overlay:rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#EFEAE2;--panel:#FFFFFF;--panel-2:#F0F2F5;--panel-3:#E9EDEF;
  --text:#111B21;--text-2:#667781;--border:#E9EDEF;
  --bubble-out:#D9FDD3;--bubble-in:#FFFFFF;--overlay:rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit;outline:none}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
.hidden{display:none!important}
.ico{width:24px;height:24px;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico.sm{width:20px;height:20px}
.ico.xs{width:16px;height:16px}

/* AUTH */
#auth{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0b141a,#0a2e26);padding:24px;gap:14px;z-index:1000}
#auth .logo{font-size:32px;font-weight:800;color:#E9EDEF;margin-bottom:4px;letter-spacing:-.5px}
#auth .tag{color:#8696A0;margin-bottom:16px;font-size:14px;text-align:center}
#auth form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#auth input{padding:14px 16px;border-radius:10px;border:1px solid #223;background:#111b21;color:#E9EDEF;font-size:15px}
#auth input:focus{border-color:var(--brand)}
#auth .btn{padding:14px;border-radius:24px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;margin-top:6px}
#auth .btn:disabled{opacity:.6}
#auth .switch{color:#8696A0;font-size:14px;text-align:center;padding:10px}
#auth .err{color:#F87171;font-size:13px;text-align:center;min-height:18px}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.tab-view{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.tab-view.active{display:flex}
.app-header{background:var(--panel);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:4px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.app-header .title{font-size:21px;font-weight:600;color:var(--text);flex:1;letter-spacing:-.3px}
.app-header .title.green{color:var(--brand)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0}
.icon-btn:active{background:var(--panel-2)}
.icon-btn.brand{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(0,168,132,.4)}
.icon-btn.brand:active{transform:scale(.93)}
.icon-btn.dark{color:var(--text)}

/* SEARCH */
.search-wrap{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.search-bar{background:var(--panel-2);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:14px}
.search-bar input{flex:1;background:none;border:0;color:var(--text);font-size:15px;min-width:0}
.search-bar input::placeholder{color:var(--text-2)}

/* FILTER CHIPS */
.chips{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:16px;background:var(--panel-2);color:var(--text-2);
  font-size:13.5px;white-space:nowrap;font-weight:500;border:0;flex-shrink:0}
.chip.on{background:rgba(0,168,132,.2);color:var(--brand)}

/* LIST */
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
.list::-webkit-scrollbar{width:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);position:relative;cursor:pointer}
.row:active{background:var(--panel-2)}
.av{width:50px;height:50px;border-radius:50%;flex-shrink:0;background:var(--brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:600;font-size:19px;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:40px;height:40px;font-size:16px}
.av.xs{width:28px;height:28px;font-size:12px}
.av.lg{width:120px;height:120px;font-size:48px}
.body{flex:1;min-width:0}
.line1{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.name{font-weight:500;font-size:16px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:12px;color:var(--text-2);flex-shrink:0;display:flex;align-items:center;gap:3px}
.time.unread{color:var(--brand);font-weight:600}
.line2{display:flex;align-items:center;gap:6px}
.preview{flex:1;font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:flex;align-items:center;gap:5px;min-width:0}
.preview .ico{color:var(--text-2)}
.badge{background:var(--brand);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 7px;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.online-dot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;
  background:#31A24C;border:2.5px solid var(--panel)}
.icon-mini{color:var(--text-2);flex-shrink:0}
.row-icons{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0}
.archived-row{padding:14px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);cursor:pointer}
.archived-row .ico{width:22px;height:22px;color:var(--text-2)}
.archived-row .label{flex:1;font-size:15px;font-weight:500}
.archived-row .count{font-size:14px;color:var(--text-2)}
.empty{padding:60px 30px;text-align:center;color:var(--text-2);font-size:14px}
.empty .ico{width:52px;height:52px;stroke-width:1.5;margin-bottom:14px;opacity:.4}
.section-title{padding:14px 16px 6px;font-size:13.5px;color:var(--brand);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* NAV */
.nav{background:var(--panel);border-top:1px solid var(--border);display:flex;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom)) 0;flex-shrink:0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;color:var(--text-2);font-size:11.5px;font-weight:500;position:relative}
.nav button.active{color:var(--brand)}
.nav button .ico{width:24px;height:24px}
.nav-badge{position:absolute;top:-2px;right:calc(50% - 24px);background:var(--brand);color:#fff;
  font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;padding:0 4px;
  display:flex;align-items:center;justify-content:center}
.nav-badge.hidden{display:none}

/* CONVO */
#convo{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#convo.open{display:flex}
#convo::before{content:"";position:absolute;inset:0;background-image:
  repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 24px);
  pointer-events:none;z-index:0}
.convo-header{background:var(--panel);padding:8px 8px;display:flex;align-items:center;gap:6px;
  flex-shrink:0;border-bottom:1px solid var(--border);z-index:2;position:relative}
.convo-header .back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
.convo-header .back:active{background:var(--panel-2)}
.convo-header .hd-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px;border-radius:8px}
.convo-header .hd-info:active{background:var(--panel-2)}
.convo-header .n{font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo-header .s{font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#messages{flex:1;overflow-y:auto;padding:10px 8px 6px;z-index:1;position:relative}
#messages::-webkit-scrollbar{width:0}
.day-divider{text-align:center;margin:10px 0}
.day-divider span{background:var(--panel-2);color:var(--text-2);padding:4px 12px;border-radius:12px;font-size:12px}
.msg{max-width:82%;margin-bottom:4px;display:flex;flex-direction:column;position:relative}
.msg.me{align-items:flex-end;margin-left:auto}
.bubble{padding:6px 9px 5px;border-radius:8px;position:relative;word-wrap:break-word;overflow-wrap:break-word;
  font-size:15px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.15);animation:msgIn .18s ease-out;max-width:100%}
.msg.them .bubble{background:var(--bubble-in);border-top-left-radius:2px;color:var(--text)}
.msg.me .bubble{background:var(--bubble-out);border-top-right-radius:2px}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bubble .content{white-space:pre-wrap;word-break:break-word}
.bubble .attach-img{max-width:280px;max-height:280px;border-radius:6px;margin:-2px -2px 4px;display:block;cursor:pointer}
.bubble .attach-file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.15);padding:10px;border-radius:6px;margin:-2px -2px 4px;min-width:200px;text-decoration:none;color:inherit}
.bubble .attach-file .fico{width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble .attach-file .fname{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble .attach-file .fsize{font-size:11.5px;opacity:.7}
.bubble .reply-preview{border-left:3px solid var(--brand);padding:5px 8px;background:rgba(0,0,0,.15);border-radius:4px;margin:-2px -2px 4px;font-size:13px;max-width:100%;overflow:hidden}
.bubble .reply-preview .rp-name{font-weight:600;color:var(--brand);margin-bottom:2px}
.bubble .reply-preview .rp-text{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble .meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:1px;font-size:11px;color:var(--text-2)}
.msg.me .bubble .meta{color:rgba(233,237,239,.7)}
[data-theme="light"] .msg.me .bubble .meta{color:#667781}
.bubble .check{display:inline-flex;align-items:center;color:#53BDEB}
.bubble .check .ico{width:15px;height:15px;stroke-width:2.5}
.bubble.deleted{opacity:.7;font-style:italic}
.sender-name{font-size:12.5px;font-weight:600;padding:0 10px 2px;margin-top:0}
.star-badge{position:absolute;top:-4px;right:-4px;background:var(--panel);border-radius:50%;padding:2px;color:#F5C33B;box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* COMPOSER */
.composer{background:var(--panel);padding:6px 8px calc(6px + env(safe-area-inset-bottom)) 8px;
  display:flex;align-items:flex-end;gap:3px;flex-shrink:0;z-index:2}
.composer .icon-btn{width:40px;height:40px}
.input-wrap{flex:1;background:var(--panel-2);border-radius:22px;padding:6px 6px 6px 14px;
  display:flex;align-items:flex-end;gap:2px;min-width:0}
.composer textarea{flex:1;background:none;border:0;padding:6px 0;resize:none;max-height:120px;
  font-size:15px;color:var(--text);line-height:1.35;min-height:24px;font-family:inherit;min-width:0}
.composer textarea::placeholder{color:var(--text-2)}
.send-btn{background:var(--brand);color:#fff;width:44px;height:44px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,168,132,.4)}
.send-btn:active{transform:scale(.93)}
.send-btn .ico{width:20px;height:20px}

/* REPLY BAR */
.reply-bar{background:var(--panel-2);padding:8px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.reply-bar .rb-line{width:3px;height:34px;background:var(--brand);border-radius:2px;flex-shrink:0}
.reply-bar .rb-body{flex:1;min-width:0;font-size:13px}
.reply-bar .rb-name{color:var(--brand);font-weight:600;margin-bottom:2px}
.reply-bar .rb-text{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* INFO PAGE (Contact / Group) */
#infoPage{position:fixed;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column}
#infoPage.open{display:flex}
.info-header{background:var(--panel);padding:10px 8px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.info-header .title{flex:1;font-size:17px;font-weight:500}
.info-scroll{flex:1;overflow-y:auto;background:var(--panel-2)}
.info-section{background:var(--panel);margin-bottom:8px;padding:16px}
.info-profile{text-align:center;padding:24px 16px}
.info-profile .av{margin:0 auto 14px}
.info-profile .n{font-size:22px;font-weight:500;margin-bottom:4px;color:var(--text)}
.info-profile .about{font-size:14.5px;color:var(--text-2);margin-bottom:18px}
.info-actions{display:flex;gap:12px;justify-content:center;margin-top:6px}
.info-actions .act{background:var(--panel-2);border-radius:22px;padding:9px 18px;display:flex;
  align-items:center;gap:8px;color:var(--brand);font-size:14.5px;font-weight:500}
.info-actions .act:active{background:var(--panel-3)}
.info-actions .act .ico{width:20px;height:20px}
.info-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.info-row:last-child{border-bottom:0}
.info-row .ico{color:var(--text-2);flex-shrink:0}
.info-row .lbl{flex:1;font-size:15.5px}
.info-row .val{color:var(--text-2);font-size:14.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-row.danger .lbl,.info-row.danger .ico{color:#F87171}
.info-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:8px;overflow:hidden}
.info-media-grid .mi{aspect-ratio:1;background:var(--panel-2);overflow:hidden;cursor:pointer}
.info-media-grid .mi img{width:100%;height:100%;object-fit:cover}
.info-media-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer}
.info-media-title .t{font-size:15px;color:var(--text-2)}
.info-media-title .n{font-size:13.5px;color:var(--brand)}

/* MEMBERS */
.member-row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.member-row .role{color:var(--brand);font-size:11.5px;font-weight:600;border:1px solid var(--brand);
  padding:1px 6px;border-radius:4px;margin-left:auto;flex-shrink:0}

/* SETTINGS */
.settings-profile{display:flex;align-items:center;gap:14px;padding:18px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--panel)}
.settings-profile:active{background:var(--panel-2)}
.settings-profile .info{flex:1;min-width:0}
.settings-profile .n{font-size:19px;font-weight:500;margin-bottom:2px}
.settings-profile .a{font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-section{padding:4px 0;border-bottom:8px solid var(--panel-2);background:var(--panel)}
.setting-row{display:flex;align-items:center;gap:18px;padding:14px 16px;cursor:pointer}
.setting-row:active{background:var(--panel-2)}
.setting-row .ico{color:var(--text-2);width:24px;height:24px;flex-shrink:0}
.setting-row .lbl{flex:1;font-size:15.5px}
.setting-row .val{font-size:14.5px;color:var(--text-2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setting-row.danger .lbl{color:#F87171}
.setting-row.danger .ico{color:#F87171}

/* SHEET */
.sheet-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-backdrop.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;
  animation:sheetIn .22s ease-out;max-height:88vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 14px;font-size:17px;font-weight:600}
.sheet input,.sheet textarea{width:100%;padding:12px 14px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit}
.sheet textarea{resize:vertical;min-height:80px}
.sheet .btn{padding:12px;border-radius:24px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;width:100%;margin-top:6px}
.sheet .btn-ghost{background:var(--panel-2);color:var(--text);margin-top:8px}
.sheet .menu-row{display:flex;align-items:center;gap:14px;padding:12px 8px;cursor:pointer;border-radius:8px}
.sheet .menu-row:active{background:var(--panel-2)}
.sheet .menu-row .ico{color:var(--text-2)}
.sheet .menu-row.danger{color:#F87171}
.sheet .menu-row.danger .ico{color:#F87171}
.sheet .color-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sheet .color-dot{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.sheet .color-dot.on{border-color:#fff;box-shadow:0 0 0 2px var(--panel-2)}
.sheet .user-pick{display:flex;align-items:center;gap:12px;padding:10px 8px;cursor:pointer;border-radius:8px}
.sheet .user-pick:active{background:var(--panel-2)}
.sheet .user-pick.on{background:rgba(0,168,132,.12)}
.sheet .cb{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-2);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.sheet .user-pick.on .cb{background:var(--brand);border-color:var(--brand)}
.sheet .user-pick.on .cb .ico{width:14px;height:14px;color:#fff;stroke-width:3}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:14px}
.emoji-grid button{font-size:24px;padding:6px;border-radius:8px;text-align:center;line-height:1}
.emoji-grid button:active{background:var(--panel-2)}

/* STATUS VIEWER */
.status-viewer{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column}
.status-viewer.open{display:flex}
.status-progress{display:flex;gap:3px;padding:10px 12px 0;flex-shrink:0}
.status-progress .bar{flex:1;height:2.5px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.status-progress .bar .fill{height:100%;width:0%;background:#fff}
.status-progress .bar.done .fill{width:100%}
.status-header{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;flex-shrink:0}
.status-header .meta{flex:1;min-width:0}
.status-header .n{font-weight:600;font-size:15px}
.status-header .t{font-size:12px;opacity:.7}
.status-header .x{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff}
.status-body{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;
  color:#fff;font-size:26px;font-weight:600;line-height:1.3;word-break:break-word}
.status-nav{position:absolute;top:0;bottom:0;width:30%;z-index:10}
.status-nav.left{left:0}
.status-nav.right{right:0;width:70%}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);
  color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:999;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* IMG FULLSCREEN */
#imgView{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
#imgView.open{display:flex}
#imgView img{max-width:100%;max-height:100%;object-fit:contain}
#imgView .close-btn{position:absolute;top:16px;right:16px;color:#fff;background:rgba(0,0,0,.5);
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* CALL SCREEN */
#callScreen{position:fixed;inset:0;background:#0b141a;z-index:400;display:none;flex-direction:column;
  align-items:center;justify-content:space-between;padding:40px 20px;color:#fff;text-align:center}
#callScreen.open{display:flex}
#callScreen .av-call{width:120px;height:120px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:600;overflow:hidden;margin:60px auto 24px}
#callScreen .av-call img{width:100%;height:100%;object-fit:cover}
#callScreen .cname{font-size:24px;font-weight:500;margin-bottom:8px}
#callScreen .cstatus{font-size:15px;color:#8696A0;margin-bottom:30px}
#callScreen .ctrls{display:flex;gap:20px;justify-content:center;margin-bottom:30px}
#callScreen .ctrl{width:60px;height:60px;border-radius:50%;background:#2A3942;display:flex;
  align-items:center;justify-content:center;color:#fff}
#callScreen .ctrl.end{background:#F15C6D}

@media(min-width:768px){
  #app{max-width:600px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  #convo,#infoPage{max-width:600px;left:50%;transform:translateX(-50%)}
}
</style>
</head>

<!-- AUTH -->
<div id="auth">
  <div class="logo">EKK CHAT</div>
  <div class="tag" id="authTag">Masuk atau daftar untuk mulai chat</div>
  <form id="authForm" autocomplete="off">
    <input id="a_name" placeholder="Nama tampilan" style="display:none">
    <input id="a_user" placeholder="Username" autocapitalize="none" autocorrect="off">
    <input id="a_pass" type="password" placeholder="Password (min 6 karakter)">
    <div class="err" id="authErr"></div>
    <button type="submit" class="btn" id="authBtn">Masuk</button>
    <button type="button" class="switch" id="authSwitch">Belum punya akun? Daftar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- TAB: CHAT -->
  <div class="tab-view active" data-tab="chats">
    <div class="app-header">
      <div class="title green">EKK CHAT</div>
      <button class="icon-btn" onclick="openNewChatSheet()" aria-label="Cari"><svg class="ico"><use href="#i-search"/></svg></button>
      <button class="icon-btn" onclick="openMainMenu()" aria-label="Menu"><svg class="ico"><use href="#i-more"/></svg></button>
    </div>
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="ico sm"><use href="#i-search"/></svg>
        <input id="chatSearch" placeholder="Tanya atau cari">
      </div>
    </div>
    <div class="chips" id="chatChips">
      <button class="chip on" data-f="all">Semua</button>
      <button class="chip" data-f="unread">Belum dibaca</button>
      <button class="chip" data-f="fav">Favorit</button>
      <button class="chip" data-f="group">Grup</button>
    </div>
    <div class="list" id="chatsList"></div>
  </div>

  <!-- TAB: UPDATES -->
  <div class="tab-view" data-tab="updates">
    <div class="app-header">
      <div class="title">Pembaruan</div>
      <button class="icon-btn" onclick="openStatusSheet()" aria-label="Tambah"><svg class="ico"><use href="#i-camera"/></svg></button>
      <button class="icon-btn" onclick="toast('Cari pembaruan')" aria-label="Cari"><svg class="ico"><use href="#i-search"/></svg></button>
    </div>
    <div class="list" id="updatesList"></div>
  </div>

  <!-- TAB: CALLS -->
  <div class="tab-view" data-tab="calls">
    <div class="app-header">
      <div class="title">Panggilan</div>
      <button class="icon-btn" onclick="openDialPad()" aria-label="Dial"><svg class="ico"><use href="#i-dialpad"/></svg></button>
    </div>
    <div class="chips">
      <button class="chip on">Semua</button>
    </div>
    <div class="list" id="callsList"></div>
  </div>

  <!-- TAB: SETTINGS -->
  <div class="tab-view" data-tab="settings">
    <div class="app-header">
      <div class="title">Pengaturan</div>
      <button class="icon-btn" onclick="toast('Cari pengaturan')" aria-label="Cari"><svg class="ico"><use href="#i-search"/></svg></button>
    </div>
    <div class="list" id="settingsList"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="nav">
    <button data-tab="chats" class="active">
      <svg class="ico"><use href="#i-chat"/></svg>
      <span>Chat</span>
      <span class="nav-badge hidden" id="navUnread">0</span>
    </button>
    <button data-tab="updates">
      <svg class="ico"><use href="#i-status"/></svg>
      <span>Pembaruan</span>
    </button>
    <button data-tab="calls">
      <svg class="ico"><use href="#i-phone"/></svg>
      <span>Panggilan</span>
    </button>
    <button data-tab="settings">
      <svg class="ico"><use href="#i-settings"/></svg>
      <span>Pengaturan</span>
    </button>
  </div>
</div>

<!-- CONVERSATION -->
<div id="convo">
  <div class="convo-header">
    <button class="back" onclick="closeConvo()"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="hd-info" onclick="openChatInfo()">
      <div class="av sm" id="cAv">?</div>
      <div style="flex:1;min-width:0">
        <div class="n" id="cName"></div>
        <div class="s" id="cStatus"></div>
      </div>
    </div>
    <button class="icon-btn" onclick="startCall('voice')" aria-label="Panggil suara"><svg class="ico"><use href="#i-phone"/></svg></button>
    <button class="icon-btn" onclick="startCall('video')" aria-label="Panggil video"><svg class="ico"><use href="#i-video"/></svg></button>
    <button class="icon-btn" onclick="openChatMenu()" aria-label="Menu"><svg class="ico"><use href="#i-more"/></svg></button>
  </div>
  <div id="replyBar" class="reply-bar hidden">
    <div class="rb-line"></div>
    <div class="rb-body">
      <div class="rb-name" id="rbName"></div>
      <div class="rb-text" id="rbText"></div>
    </div>
    <button class="icon-btn" onclick="cancelReply()" aria-label="Batal"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <div id="messages"></div>
  <div class="composer">
    <button class="icon-btn" onclick="openEmoji()" aria-label="Emoji"><svg class="ico"><use href="#i-smile"/></svg></button>
    <div class="input-wrap">
      <textarea id="msgInput" rows="1" placeholder="Pesan"></textarea>
      <button class="icon-btn" onclick="openAttach()" aria-label="Lampiran"><svg class="ico sm"><use href="#i-attach"/></svg></button>
      <button class="icon-btn" onclick="startVoiceRec()" aria-label="Rekam"><svg class="ico sm"><use href="#i-camera"/></svg></button>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="Kirim"><svg class="ico"><use href="#i-send"/></svg></button>
  </div>
</div>

<!-- INFO PAGE -->
<div id="infoPage">
  <div class="info-header">
    <button class="icon-btn dark" onclick="closeInfo()"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="title" id="infoTitle">Info</div>
    <button class="icon-btn dark" onclick="openInfoMenu()"><svg class="ico"><use href="#i-more"/></svg></button>
  </div>
  <div class="info-scroll" id="infoBody"></div>
</div>

<!-- SHEET -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
</div>

<!-- STATUS VIEWER -->
<div id="statusViewer" class="status-viewer">
  <div class="status-progress" id="statusProgress"></div>
  <div class="status-header">
    <div class="av sm" id="svAv"></div>
    <div class="meta"><div class="n" id="svName"></div><div class="t" id="svTime"></div></div>
    <button class="x" onclick="closeStatusViewer()"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <div class="status-nav left" onclick="prevStatus()"></div>
  <div class="status-nav right" onclick="nextStatus()"></div>
  <div class="status-body" id="svBody"></div>
</div>

<!-- CALL SCREEN -->
<div id="callScreen">
  <div style="width:100%">
    <div class="av-call" id="callAv">?</div>
    <div class="cname" id="callName"></div>
    <div class="cstatus" id="callStatus">Memanggil...</div>
  </div>
  <div class="ctrls">
    <button class="ctrl" id="callMute" onclick="toast('Mic toggle (demo)')"><svg class="ico"><use href="#i-mic-on"/></svg></button>
    <button class="ctrl" onclick="toast('Speaker (demo)')"><svg class="ico"><use href="#i-volume"/></svg></button>
    <button class="ctrl end" onclick="endCall()"><svg class="ico"><use href="#i-phone-end"/></svg></button>
  </div>
</div>

<div id="imgView" onclick="this.classList.remove('open')">
  <div class="close-btn"><svg class="ico"><use href="#i-x"/></svg></div>
  <img id="imgViewImg" src="">
</div>
<div id="toast"></div>
<input type="file" id="fileInput" style="display:none" accept="*/*">

<script src="/socket.io/socket.io.js"></script>
<script>
// =============== STATE ===============
let me=null,socket=null,currentChat=null,typingTO=null,lastTyping=0,chatTimer=null;
let statusTimer=null,statusIdx=0,statusList=[],pendingReply=null;
let allChats=[],chatFilter='all',showArchived=false;
let currentInfo=null;
const $=id=>document.getElementById(id);
const ICO=(name,cls='ico')=>`<svg class="${cls}"><use href="#i-${name}"/></svg>`;

function toast(m,d=2400){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),d);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTime(iso){if(!iso)return'';const d=new Date(iso),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const df=(n-d)/86400000;if(df<1)return'Kemarin';
  if(df<7)return d.toLocaleDateString([],{weekday:'short'});
  return d.toLocaleDateString([],{day:'2-digit',month:'2-digit',year:'2-digit'});}
function avHtml(u,cls='av'){
  if(!u)return `<div class="${cls}">?</div>`;
  const init=(u.display_name||'?')[0].toUpperCase();
  const src=u.avatar_url?`<img src="${esc(u.avatar_url)}" alt="">`:init;
  return `<div class="${cls}">${src}</div>`;
}
function fmtSize(b){if(!b)return'';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}

// =============== AUTH ===============
let authMode='login';
function setAuthMode(m){authMode=m;const r=m==='register';
  $('a_name').style.display=r?'block':'none';
  $('authBtn').textContent=r?'Daftar':'Masuk';
  $('authSwitch').textContent=r?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';
  $('authTag').textContent=r?'Buat akun baru untuk mulai chat':'Masuk atau daftar untuk mulai chat';
  $('authErr').textContent='';}
$('authSwitch').onclick=()=>setAuthMode(authMode==='login'?'register':'login');
$('authForm').onsubmit=async e=>{
  e.preventDefault();$('authErr').textContent='';
  const u=$('a_user').value.trim().toLowerCase(),p=$('a_pass').value,n=$('a_name').value.trim();
  if(!u||!p){$('authErr').textContent='Isi semua dulu';return;}
  if(authMode==='register'&&!n){$('authErr').textContent='Nama wajib diisi';return;}
  $('authBtn').disabled=true;
  try{
    const url=authMode==='login'?'/api/login':'/api/register';
    const body=authMode==='login'?{username:u,password:p}:{username:u,password:p,displayName:n};
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){$('authErr').textContent=mapErr(d.error);return;}
    me=d.user;startApp();
  }catch{$('authErr').textContent='Koneksi gagal';}
  finally{$('authBtn').disabled=false;}
};
function mapErr(c){return({missing_field:'Isi semua',too_short:'Username min 3, password min 6',username_taken:'Username sudah dipakai',invalid:'Username atau password salah',db_error:'Server bermasalah'})[c]||'Terjadi kesalahan';}

// =============== BOOT ===============
async function tryAutoLogin(){try{const r=await fetch('/api/me',{credentials:'include'});if(r.ok){const d=await r.json();me=d.user;startApp();return;}}catch{}$('auth').classList.remove('hidden');}
function startApp(){
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  connectSocket();loadChats();loadUpdates();loadCalls();renderSettings();
  setInterval(()=>{if(socket)socket.emit('heartbeat');},30000);
}

// =============== NAV ===============
document.querySelectorAll('.nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
    document.querySelector(`.tab-view[data-tab="${b.dataset.tab}"]`).classList.add('active');
    if(b.dataset.tab==='updates')loadUpdates();
    if(b.dataset.tab==='calls')loadCalls();
    if(b.dataset.tab==='settings')renderSettings();
  };
});

// CHAT FILTER CHIPS
document.querySelectorAll('#chatChips .chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('#chatChips .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');chatFilter=c.dataset.f;renderChats();
  };
});

// =============== SOCKET ===============
function connectSocket(){
  socket=io({withCredentials:true});
  socket.on('message:new',msg=>{
    if(currentChat){
      const isCur=currentChat.kind==='group'
        ? msg.group_id===currentChat.id
        : (msg.sender_id===currentChat.id||msg.recipient_id===currentChat.id)&&(msg.sender_id===me.id||msg.recipient_id===me.id);
      if(isCur)appendMessage(msg);
    }
    loadChats();
  });
  socket.on('message:deleted',({id,forAll})=>{
    const el=document.getElementById('m_'+id);
    if(el){const c=el.querySelector('.content');
      if(c)c.innerHTML='<i>Pesan ini telah dihapus</i>';
      el.querySelector('.bubble')?.classList.add('deleted');}
    loadChats();
  });
  socket.on('typing',({from,isTyping})=>{
    if(!currentChat)return;
    if(currentChat.kind!=='group'&&from!==currentChat.id)return;
    if(isTyping){$('cStatus').textContent='sedang mengetik…';clearTimeout(typingTO);typingTO=setTimeout(updateConvoStatus,3500);}
    else updateConvoStatus();
  });
  socket.on('status:new',loadUpdates);
  socket.on('group:new',loadChats);
  socket.on('group:updated',()=>{if(currentInfo)openChatInfo(currentInfo);loadChats();});
  socket.on('call:new',loadCalls);
}

// =============== CHAT LIST ===============
async function loadChats(){
  try{
    const r=await fetch('/api/chats',{credentials:'include'});
    const d=await r.json();
    allChats=d.chats||[];
    renderChats();
  }catch(e){console.error(e);}
}
function renderChats(){
  const list=$('chatsList');
  let visible=allChats.filter(c=>!c.archived);
  const archived=allChats.filter(c=>c.archived);
  if(chatFilter==='unread')visible=visible.filter(c=>c.unread>0);
  else if(chatFilter==='fav')visible=visible.filter(c=>c.favorited);
  else if(chatFilter==='group')visible=visible.filter(c=>c.kind==='group');

  if(!visible.length&&!archived.length&&!showArchived){
    list.innerHTML=`<div class="empty">${ICO('chat')}<div>Belum ada chat.<br>Tap ikon cari untuk mulai.</div></div>`;
    updateNavUnread(0);return;
  }

  let html='';
  if(archived.length){
    html+=`<div class="archived-row" onclick="toggleArchived()">
      ${ICO('archive')}<div class="label">Diarsipkan</div><div class="count">${archived.length}</div>
      ${ICO(showArchived?'chev-down':'chev-right','ico sm')}
    </div>`;
    if(showArchived)visible=[...archived,...visible];
  }
  html+=visible.map(renderChatRow).join('');
  list.innerHTML=html||`<div class="empty">${ICO('chat')}<div>Tidak ada chat yang cocok</div></div>`;
  const total=allChats.reduce((s,c)=>s+(c.unread||0),0);
  updateNavUnread(total);
}
function toggleArchived(){showArchived=!showArchived;renderChats();}
function renderChatRow(c){
  if(c.kind==='group'){
    const last=c.lastMessage?(c.lastMessage.length>45?c.lastMessage.slice(0,45)+'…':c.lastMessage):'Grup baru';
    return `<div class="row" onclick='openGroup(${c.id},${JSON.stringify(JSON.stringify(c.name))})'>
      ${avHtml({display_name:c.name,avatar_url:c.avatar_url})}
      <div class="body">
        <div class="line1">
          <div class="name">${esc(c.name)}</div>
          <div class="time">${c.pinned?ICO('pin','ico xs icon-mini'):''} ${formatTime(c.lastTime)}</div>
        </div>
        <div class="line2">
          <div class="preview">${esc(last)}</div>
          ${c.muted?ICO('bell-off','ico xs icon-mini'):''}
        </div>
      </div>
    </div>`;
  }
  const u=c.user;
  const dot=u.is_online?'<span class="online-dot"></span>':'';
  const last=c.lastMessage||'';
  const preview=c.hasAtt?`${ICO('image','ico xs')} ${esc(last.slice(0,42))}`:esc(last.slice(0,48));
  return `<div class="row" onclick='openChat(${JSON.stringify(JSON.stringify(u))})'>
    <div style="position:relative">${avHtml(u)}${dot}</div>
    <div class="body">
      <div class="line1">
        <div class="name">${esc(u.display_name)}</div>
        <div class="time ${c.unread>0?'unread':''}">
          ${c.pinned?ICO('pin','ico xs icon-mini'):''}
          ${formatTime(c.lastTime)}
        </div>
      </div>
      <div class="line2">
        <div class="preview">${preview||'<i>Mulai percakapan</i>'}</div>
        ${c.muted?ICO('bell-off','ico xs icon-mini'):''}
        ${c.unread>0?`<div class="badge">${c.unread}</div>`:''}
      </div>
    </div>
  </div>`;
}
function updateNavUnread(n){const b=$('navUnread');if(n>0){b.textContent=n>99?'99+':n;b.classList.remove('hidden');}else b.classList.add('hidden');}
$('chatSearch').oninput=()=>{
  clearTimeout(chatTimer);chatTimer=setTimeout(async()=>{
    const q=$('chatSearch').value.trim();
    if(!q){renderChats();return;}
    const r=await fetch('/api/users?q='+encodeURIComponent(q),{credentials:'include'});
    const d=await r.json();
    const list=$('chatsList');
    if(!d.users.length){list.innerHTML=`<div class="empty">${ICO('search')}<div>Tidak ada user ditemukan</div></div>`;return;}
    list.innerHTML=d.users.map(u=>`<div class="row" onclick='openChat(${JSON.stringify(JSON.stringify(u))})'>
      ${avHtml(u)}
      <div class="body">
        <div class="line1"><div class="name">${esc(u.display_name)}</div></div>
        <div class="line2"><div class="preview">@${esc(u.username)} — ${esc(u.about||'')}</div></div>
      </div>
    </div>`).join('');
  },250);
};

// =============== CONVERSATION ===============
function openChat(json){
  const u=JSON.parse(json);
  currentChat={...u,kind:'user'};pendingReply=null;hideReplyBar();
  $('cName').textContent=u.display_name;
  updateConvoStatus();
  $('cAv').innerHTML=u.avatar_url?`<img src="${esc(u.avatar_url)}" alt="">`:(u.display_name||'?')[0].toUpperCase();
  $('convo').classList.add('open');
  $('messages').innerHTML='<div style="text-align:center;color:var(--text-2);padding:20px;font-size:13px">Memuat…</div>';
  fetch(`/api/messages/${u.id}`,{credentials:'include'}).then(r=>r.json()).then(d=>{
    renderMessages(d.messages||[]);
  });
  setTimeout(()=>$('msgInput').focus(),250);
}
function openGroup(id,nameJson){
  const name=JSON.parse(nameJson);
  currentChat={id,kind:'group',display_name:name};pendingReply=null;hideReplyBar();
  $('cName').textContent=name;
  $('cStatus').textContent='memuat…';
  $('cAv').innerHTML=(name||'?')[0].toUpperCase();
  $('convo').classList.add('open');
  $('messages').innerHTML='<div style="text-align:center;color:var(--text-2);padding:20px;font-size:13px">Memuat…</div>';
  fetch(`/api/groups/${id}/members`,{credentials:'include'}).then(r=>r.json()).then(d=>{
    const ms=(d.members||[]).map(m=>m.display_name);
    $('cStatus').textContent=ms.length?ms.join(', ').slice(0,80):'';
  });
  fetch(`/api/messages/group/${id}`,{credentials:'include'}).then(r=>r.json()).then(d=>{
    renderMessages(d.messages||[]);
  });
  setTimeout(()=>$('msgInput').focus(),250);
}
function closeConvo(){$('convo').classList.remove('open');currentChat=null;loadChats();}
function updateConvoStatus(){
  if(!currentChat||currentChat.kind==='group')return;
  const u=currentChat;
  $('cStatus').textContent=u.is_online?'online':(u.last_seen?'terakhir dilihat '+formatTime(u.last_seen):'');
}
function renderMessages(msgs){
  const m=$('messages');m.innerHTML='';
  if(!msgs||!msgs.length){m.innerHTML='<div style="text-align:center;color:var(--text-2);padding:30px 20px;font-size:13px">Belum ada pesan. Mulai ngobrol!</div>';return;}
  msgs.forEach(renderMessage);
  scrollBottom();
}
function renderMessage(msg){
  const mine=msg.sender_id===me.id;
  const div=document.createElement('div');
  div.className='msg '+(mine?'me':'them');div.id='m_'+msg.id;
  if(msg.deleted){
    div.innerHTML=`<div class="bubble deleted"><div class="content"><i>Pesan ini telah dihapus</i></div></div>`;
    mAppend(div);return;
  }
  let attachHtml='';
  if(msg.attachment){
    const a=msg.attachment;
    if(a.kind==='image'){
      attachHtml=`<img class="attach-img" src="${a.data}" onclick="viewImage('${(a.data||'').replace(/'/g,'\\\'')}')" alt="">`;
    }else{
      attachHtml=`<a class="attach-file" href="${a.data}" download="${esc(a.name)}">
        <div class="fico">${ICO('file','ico sm')}</div>
        <div style="min-width:0;flex:1"><div class="fname">${esc(a.name)}</div><div class="fsize">${fmtSize(a.size)}</div></div>
      </a>`;
    }
  }
  let replyHtml='';
  if(msg.reply_to_id&&msg._reply){
    replyHtml=`<div class="reply-preview"><div class="rp-name">${esc(msg._reply.name)}</div><div class="rp-text">${esc(msg._reply.text).slice(0,80)}</div></div>`;
  }
  const time=new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const check=mine?(msg.read_at?`<span class="check">${ICO('check-2','ico')}</span>`:`<span class="check" style="opacity:.6">${ICO('check','ico')}</span>`):'';
  let senderName='';
  if(!mine&&currentChat&&currentChat.kind==='group'){
    const c=['#53BDEB','#E542A3','#F5C33B','#7FD97A','#F0716A','#B47DFF'];
    senderName=`<div class="sender-name" style="color:${c[msg.sender_id%c.length]}">User ${msg.sender_id}</div>`;
  }
  const isStarred=msg._starred?`<span class="star-badge">${ICO('star','ico xs')}</span>`:'';
  div.innerHTML=`${senderName}<div class="bubble" data-mid="${msg.id}" style="position:relative">
    ${isStarred}${replyHtml}${attachHtml}
    ${msg.content?`<div class="content">${linkify(esc(msg.content))}</div>`:''}
    <div class="meta"><span>${time}</span>${check}</div>
  </div>`;
  const bub=div.querySelector('.bubble');
  let pressTimer;
  const start=()=>{pressTimer=setTimeout(()=>openMsgMenu(msg),500);};
  const cancel=()=>{clearTimeout(pressTimer);};
  bub.addEventListener('touchstart',start);bub.addEventListener('touchend',cancel);bub.addEventListener('touchmove',cancel);
  bub.addEventListener('contextmenu',e=>{e.preventDefault();openMsgMenu(msg);});
  mAppend(div);
}
function mAppend(el){$('messages').appendChild(el);scrollBottom();}
function appendMessage(msg){const em=$('messages').querySelector('div[style]');if(em&&!em.id)$('messages').innerHTML='';renderMessage(msg);}
function scrollBottom(){const el=$('messages');requestAnimationFrame(()=>el.scrollTop=el.scrollHeight);}
function linkify(t){return t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');}

// =============== COMPOSER ===============
const ta=$('msgInput');
ta.oninput=()=>{
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  if(!socket||!currentChat)return;
  const now=Date.now();
  if(now-lastTyping>1500){
    socket.emit('typing',currentChat.kind==='group'?{groupId:currentChat.id,isTyping:true}:{to:currentChat.id,isTyping:true});
    lastTyping=now;
    setTimeout(()=>{if(socket&&currentChat)socket.emit('typing',currentChat.kind==='group'?{groupId:currentChat.id,isTyping:false}:{to:currentChat.id,isTyping:false});},2500);
  }
};
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
$('sendBtn').onclick=sendMsg;
function sendMsg(){
  const text=ta.value.trim();
  if(!text||!currentChat||!socket)return;
  const payload={content:text,replyTo:pendingReply?.id||null};
  if(currentChat.kind==='group')payload.groupId=currentChat.id;else payload.to=currentChat.id;
  socket.emit('message:send',payload);
  ta.value='';ta.style.height='auto';cancelReply();
}

// =============== REPLY ===============
function setReply(msg){
  pendingReply={id:msg.id,text:msg.content||msg.attachment?.name||'Lampiran',name:msg.sender_id===me.id?'Anda':'Kontak'};
  $('rbName').textContent='Membalas '+pendingReply.name;
  $('rbText').textContent=pendingReply.text.slice(0,60);
  $('replyBar').classList.remove('hidden');
  ta.focus();
}
function cancelReply(){pendingReply=null;hideReplyBar();}
function hideReplyBar(){$('replyBar').classList.add('hidden');}

// =============== MSG MENU ===============
function openMsgMenu(msg){
  const mine=msg.sender_id===me.id;
  let rows='';
  rows+=`<div class="menu-row" onclick='setReply(${JSON.stringify(JSON.stringify(msg))});closeSheet()'>${ICO('reply')}<div style="flex:1">Balas</div></div>`;
  if(msg.content&&!msg.attachment){
    rows+=`<div class="menu-row" onclick='copyText(${JSON.stringify(JSON.stringify(msg.content))});closeSheet()'>${ICO('file')}<div style="flex:1">Salin</div></div>`;
  }
  if(msg.attachment){
    rows+=`<div class="menu-row" onclick='downloadAtt(${JSON.stringify(JSON.stringify(msg.attachment))});closeSheet()'>${ICO('download')}<div style="flex:1">Unduh</div></div>`;
  }
  rows+=`<div class="menu-row" onclick='toggleStar(${msg.id});closeSheet()'>${ICO('star')}<div style="flex:1">${msg._starred?'Hapus tanda':'Tandai bintang'}</div></div>`;
  if(mine){
    rows+=`<div class="menu-row danger" onclick='deleteMsg(${msg.id},true);closeSheet()'>${ICO('trash')}<div style="flex:1">Hapus untuk semua</div></div>`;
    rows+=`<div class="menu-row danger" onclick='deleteMsg(${msg.id},false);closeSheet()'>${ICO('trash')}<div style="flex:1">Hapus untuk saya</div></div>`;
  } else {
    rows+=`<div class="menu-row danger" onclick='deleteMsg(${msg.id},false);closeSheet()'>${ICO('trash')}<div style="flex:1">Hapus untuk saya</div></div>`;
  }
  openSheet(`<h3>Pesan</h3>${rows}<button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
async function deleteMsg(id,forAll){
  const label=forAll?'Hapus untuk semua orang?':'Hapus untuk saya?';
  if(!confirm(label))return;
  const r=await fetch(`/api/messages/${id}/delete`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({forAll})});
  if(r.ok){const el=document.getElementById('m_'+id);if(el){
    if(forAll){const c=el.querySelector('.content');if(c)c.innerHTML='<i>Pesan ini telah dihapus</i>';el.querySelector('.bubble')?.classList.add('deleted');}
    else el.remove();
  }}
  else toast('Gagal hapus');
}
async function toggleStar(id){
  const r=await fetch(`/api/messages/${id}/star`,{method:'POST',credentials:'include'});
  const d=await r.json();
  toast(d.starred?'Ditandai':'Tanda dihapus');
  if(currentChat){
    if(currentChat.kind==='group')openGroup(currentChat.id,JSON.stringify(currentChat.display_name));
    else openChat(JSON.stringify(currentChat));
  }
}
function copyText(json){const t=JSON.parse(json);navigator.clipboard.writeText(t).then(()=>toast('Disalin')).catch(()=>toast('Gagal salin'));}
function downloadAtt(json){const a=JSON.parse(json);const link=document.createElement('a');link.href=a.data;link.download=a.name;link.click();}

// =============== ATTACH ===============
function openAttach(){
  openSheet(`<h3>Lampiran</h3>
    <div class="menu-row" onclick="pickFile('image/*')">${ICO('image')}<div style="flex:1">Gambar</div></div>
    <div class="menu-row" onclick="pickFile('*/*')">${ICO('file')}<div style="flex:1">Dokumen</div></div>
    <button class="btn btn-ghost" onclick="closeSheet()">Batal</button>`);
}
function pickFile(accept){
  closeSheet();
  const inp=$('fileInput');
  inp.accept=accept;inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>3*1024*1024){toast('Maksimal 3 MB');inp.value='';return;}
    const reader=new FileReader();
    reader.onload=async()=>{
      const data=reader.result;
      const isImg=f.type.startsWith('image/');
      const attachment={kind:isImg?'image':'file',mime:f.type,name:f.name,size:f.size,data};
      if(!socket||!currentChat)return;
      const payload={attachment,content:'',replyTo:pendingReply?.id||null};
      if(currentChat.kind==='group')payload.groupId=currentChat.id;else payload.to=currentChat.id;
      socket.emit('message:send',payload);
      cancelReply();
    };
    reader.readAsDataURL(f);inp.value='';
  };
  inp.click();
}
function startVoiceRec(){toast('Voice message — belum diaktifkan');}
function viewImage(src){$('imgViewImg').src=src;$('imgView').classList.add('open');}

function openMemberOptions(gid,memJson,isAdmin){
  const m=JSON.parse(memJson);
  const isSelf=m.id===me.id;
  let rows='';
  if(!isSelf&&isAdmin){
    if(m.role!=='admin')rows+=`<div class="menu-row" onclick="promoteMember(${gid},${m.id});closeSheet()">${ICO('star')}<div style="flex:1">Jadikan admin</div></div>`;
    rows+=`<div class="menu-row danger" onclick="kickMember(${gid},${m.id});closeSheet()">${ICO('logout')}<div style="flex:1">Keluarkan dari grup</div></div>`;
  }
  if(isSelf){rows+=`<div class="menu-row danger" onclick="leaveGroup(${gid});closeSheet()">${ICO('logout')}<div style="flex:1">Keluar dari grup</div></div>`;}
  if(!rows)rows=`<div style="padding:12px;color:var(--text-2);font-size:14px;text-align:center">Tidak ada opsi</div>`;
  openSheet(`<h3>${esc(m.display_name)}</h3>${rows}<button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
async function promoteMember(gid,uid){
  await fetch(`/api/groups/${gid}/members/${uid}/promote`,{method:'POST',credentials:'include'});
  toast('Jadikan admin');loadGroupInfo(gid);
}
async function kickMember(gid,uid){
  if(!confirm('Keluarkan anggota ini?'))return;
  await fetch(`/api/groups/${gid}/members/${uid}`,{method:'DELETE',credentials:'include'});
  toast('Anggota dikeluarkan');loadGroupInfo(gid);
}
async function leaveGroup(gid){
  if(!confirm('Keluar dari grup ini?'))return;
  await fetch(`/api/groups/${gid}/leave`,{method:'POST',credentials:'include'});
  toast('Keluar dari grup');closeSheet();closeInfo();closeConvo();loadChats();
}
async function openAddMembers(gid){
  const r=await fetch('/api/users?q=',{credentials:'include'});
  const d=await r.json();
  const mR=await fetch(`/api/groups/${gid}/members`,{credentials:'include'});
  const mD=await mR.json();
  const existing=new Set((mD.members||[]).map(m=>m.id));
  const available=(d.users||[]).filter(u=>!existing.has(u.id));
  window._addSel=new Set();
  openSheet(`<h3>Tambah anggota</h3>
    <div style="max-height:320px;overflow-y:auto;margin-bottom:10px">
      ${available.map(u=>`<div class="user-pick" data-uid="${u.id}" onclick="toggleAdd(this)">
        <div class="cb">${ICO('check','ico xs')}</div>
        ${avHtml(u,'av sm')}
        <div style="flex:1"><div class="name">${esc(u.display_name)}</div></div>
      </div>`).join('')||'<div style="text-align:center;color:var(--text-2);padding:20px">Tidak ada user tersedia</div>'}
    </div>
    <button class="btn" onclick="doAddMembers(${gid})">Tambah</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Batal</button>`);
}
function toggleAdd(el){
  const uid=parseInt(el.dataset.uid,10);
  if(window._addSel.has(uid)){window._addSel.delete(uid);el.classList.remove('on');}
  else{window._addSel.add(uid);el.classList.add('on');}
}
async function doAddMembers(gid){
  const ids=[...window._addSel];if(!ids.length)return toast('Pilih minimal 1');
  await fetch(`/api/groups/${gid}/members`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({userIds:ids})});
  toast('Anggota ditambahkan');closeSheet();loadGroupInfo(gid);loadChats();
}

async function saveGroupInfo(){
  const name=$('egName').value.trim();
  const description=$('egDesc').value.trim();
  if(!name)return toast('Isi nama');
  await fetch(`/api/groups/${currentInfo.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name,description})});
  closeSheet();toast('Grup diupdate');loadGroupInfo(currentInfo.id);loadChats();
}
async function blockUser(uid){
  const u=await fetch(`/api/users/${uid}`,{credentials:'include'}).then(r=>r.json());
  const blocked=u.user?.blocked;
  if(blocked){
    await fetch(`/api/users/${uid}/block`,{method:'DELETE',credentials:'include'});
    toast('Blokir dibuka');
  }else{
    if(!confirm('Blokir kontak ini?'))return;
    await fetch(`/api/users/${uid}/block`,{method:'POST',credentials:'include'});
    toast('Kontak diblokir');
  }
  loadContactInfo(uid);
}

  const c=currentInfo;
  const key=c.kind+':'+c.id;
  const isMuted=!!(allChats.find(x=>x.kind===c.kind&&x.id===c.id)||{}).muted;
  await fetch(`/api/chats/${c.kind}/${c.id}/settings`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({muted:!isMuted})});
  await loadChats();
  if(c.kind==='group')loadGroupInfo(c.id);else loadContactInfo(c.id);
}

async function openMediaGrid(){
  const c=currentInfo;if(!c)return;
  const url=c.kind==='group'?`/api/chats/group/${c.id}/media`:`/api/chats/user/${c.id}/media`;
  const r=await fetch(url,{credentials:'include'});
  const d=await r.json();
  const imgs=(d.media||[]).filter(m=>m.attachment&&m.attachment.kind==='image');
  if(!imgs.length)return toast('Tidak ada media');

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-height:60vh;overflow-y:auto">

    </div>`).join('');
  },220);
}

function toggleGm(el){
  const uid=parseInt(el.dataset.uid,10);
  if(window._groupSel.has(uid)){window._groupSel.delete(uid);el.classList.remove('on');}
  else{window._groupSel.add(uid);el.classList.add('on');}
}
async function createGroupNow(){
  const name=$('gName').value.trim();
  if(!name)return toast('Isi nama grup');
  const ids=[...window._groupSel];
  if(!ids.length)return toast('Pilih minimal 1 anggota');
  const r=await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name,memberIds:ids})});
  if(r.ok){const d=await r.json();closeSheet();toast('Grup dibuat');await loadChats();
    document.querySelector('.nav button[data-tab="chats"]').click();
    openGroup(d.group.id,JSON.stringify(d.group.name));
  }else toast('Gagal buat grup');
}

    </div>
  </div>`;
  if(others.length){
    html+='<div class="section-title">Pembaruan terbaru</div>';
    const byUser={};
    others.forEach(s=>{(byUser[s.user_id]||(byUser[s.user_id]={user:s,items:[]})).items.push(s);});
    Object.values(byUser).forEach(({user,items})=>{
      const latest=items[0];
      const viewed=items.every(i=>i.viewed_by_me);
      const initials=(user.display_name||'?')[0].toUpperCase();
      const avH=user.avatar_url?`<img src="${esc(user.avatar_url)}">`:initials;
      html+=`<div class="row" onclick='viewUserStatus(${user.user_id})'>
        <div style="padding:2.5px;border-radius:50%;background:${viewed?'var(--text-2)':'linear-gradient(45deg,#00A884,#06CF9C)'}">
          <div style="padding:2px;background:var(--panel);border-radius:50%">
            <div class="av">${avH}</div>
          </div>
        </div>
        <div class="body">
          <div class="line1"><div class="name">${esc(user.display_name)}</div><div class="time">${formatTime(latest.created_at)}</div></div>
          <div class="line2"><div class="preview">${items.length} pembaruan</div></div>
        </div>
      </div>`;
    });
  }else{
    html+=`<div class="empty">${ICO('status')}<div>Belum ada pembaruan dari kontak lain.</div></div>`;
  }
  list.innerHTML=html;
}
function openStatusSheet(){
  const colors=['#00A884','#0F5E51','#3B82F6','#8B5CF6','#EC4899','#F59E0B','#EF4444','#111B21'];
  openSheet(`<h3>Buat pembaruan status</h3>
    <textarea id="stText" placeholder="Ketik status..." maxlength="700"></textarea>
    <div class="color-row" id="stColors">${colors.map((c,i)=>`<div class="color-dot ${i===0?'on':''}" data-c="${c}" style="background:${c}" onclick="pickColor(this)"></div>`).join('')}</div>
    <button class="btn" onclick="postStatus()">Bagikan</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Batal</button>`);
}
function pickColor(el){document.querySelectorAll('#stColors .color-dot').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
async function postStatus(){
  const content=$('stText').value.trim();
  if(!content)return toast('Isi status dulu');
  const bgColor=document.querySelector('#stColors .on')?.dataset.c||'#00A884';
  const r=await fetch('/api/statuses',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({content,bgColor})});
  if(r.ok){closeSheet();toast('Status dibagikan');loadUpdates();}
  else toast('Gagal share status');
}
function viewUserStatus(uid){
  fetch('/api/statuses',{credentials:'include'}).then(r=>r.json()).then(d=>{
    const items=d.statuses.filter(s=>s.user_id===uid).reverse();
    if(!items.length)return;
    statusList=items;statusIdx=0;
    $('statusViewer').classList.add('open');
    showStatus();
  });
}
function showStatus(){
  if(statusIdx>=statusList.length){closeStatusViewer();return;}
  const s=statusList[statusIdx];
  $('svName').textContent=s.display_name;
  $('svTime').textContent=formatTime(s.created_at);
  $('svAv').innerHTML=s.avatar_url?`<img src="${esc(s.avatar_url)}">`:(s.display_name||'?')[0].toUpperCase();
  $('svBody').style.background=s.bg_color||'#00A884';
  $('svBody').textContent=s.content;
  $('statusProgress').innerHTML=statusList.map((_,i)=>`<div class="bar ${i<statusIdx?'done':''}"><div class="fill" style="${i===statusIdx?'width:0%':''}"></div></div>`).join('');
  const fill=$('statusProgress').children[statusIdx]?.querySelector('.fill');
  if(fill){fill.style.transition='width 5s linear';requestAnimationFrame(()=>{fill.style.width='100%';});}
  fetch(`/api/statuses/${s.id}/view`,{method:'POST',credentials:'include'}).catch(()=>{});
  clearTimeout(statusTimer);statusTimer=setTimeout(nextStatus,5200);
}
function nextStatus(){statusIdx++;showStatus();}
function prevStatus(){if(statusIdx>0){statusIdx--;showStatus();}}
function closeStatusViewer(){clearTimeout(statusTimer);$('statusViewer').classList.remove('open');statusList=[];statusIdx=0;loadUpdates();}

// =============== CALLS ===============
async function loadCalls(){
  const r=await fetch('/api/calls',{credentials:'include'});
  const d=await r.json();
  const list=$('callsList');
  if(!d.calls.length){list.innerHTML=`<div class="empty">${ICO('phone')}<div>Belum ada riwayat panggilan</div></div>`;return;}
  list.innerHTML=d.calls.map(c=>{
    const missed=c.status==='missed';
    const arrow=c.direction==='incoming'?'phone-in':(missed?'phone-missed':'phone-out');
    const color=missed?'#F87171':'var(--brand)';
    return `<div class="row">
      ${avHtml(c.user)}
      <div class="body">
        <div class="line1"><div class="name" style="${missed?'color:#F87171':''}">${esc(c.user?.display_name||'Unknown')}</div><div class="time">${formatTime(c.created_at)}</div></div>
        <div class="line2"><div class="preview" style="display:flex;align-items:center;gap:6px">
          <svg class="ico xs" style="color:${color}"><use href="#i-${arrow}"/></svg>
          ${c.direction==='incoming'?'Masuk':'Keluar'} · ${c.type==='video'?'Video':'Suara'}${missed?' · tidak terjawab':''}
        </div></div>
      </div>
      <button class="icon-btn" onclick='startCallTo(${c.user?.id},"voice")' aria-label="Panggil">${ICO('phone')}</button>
    </div>`;
  }).join('');
}
function openDialPad(){
  openSheet(`<h3>Panggil nomor</h3>
    <input id="dialNum" type="tel" placeholder="Nomor telepon" style="text-align:center;font-size:22px;letter-spacing:2px">
    <div style="display:flex;justify-content:center;margin-bottom:14px">
      <button class="send-btn" onclick="dialCall()">${ICO('phone')}</button>
    </div>
    <button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
function dialCall(){toast('Panggilan tidak didukung — nomor tidak terdaftar');closeSheet();}
async function startCallTo(uid,type){
  if(!uid)return;
  const r=await fetch('/api/users/'+uid,{credentials:'include'}).then(r=>r.json());
  const u=r.user;
  showCallScreen(u,type);
  await fetch('/api/calls',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({recipientId:uid,type,status:'missed'})}).catch(()=>{});
  setTimeout(()=>{$('callStatus').textContent='Panggilan tidak dapat terhubung (butuh server TURN)';},3500);
}
async function startCall(type){
  if(!currentChat)return;
  if(currentChat.kind==='group')return toast('Panggilan grup belum didukung');
  startCallTo(currentChat.id,type);
}
function showCallScreen(user,type){
  $('callName').textContent=user?.display_name||'Kontak';
  $('callStatus').textContent='Memanggil...';
  $('callAv').innerHTML=user?.avatar_url?`<img src="${esc(user.avatar_url)}">`:(user?.display_name||'?')[0].toUpperCase();
  $('callScreen').classList.add('open');
}
function endCall(){$('callScreen').classList.remove('open');loadCalls();}

function openProfileSheet(){
  openSheet(`<h3>Edit profil</h3>
    <div style="text-align:center;margin-bottom:14px">${avHtml(me,'av lg')}</div>
    <input id="pAvatar" placeholder="URL foto profil" value="${esc(me.avatar_url||'')}">
    <input id="pName" placeholder="Nama" value="${esc(me.display_name)}">
    <input id="pAbout" placeholder="Info" value="${esc(me.about||'')}">
    <button class="btn" onclick="saveProfile()">Simpan</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Batal</button>`);
}
async function saveProfile(){
  const displayName=$('pName').value.trim();
  const about=$('pAbout').value.trim();
  const avatarUrl=$('pAvatar').value.trim();
  if(!displayName)return toast('Nama wajib diisi');
  const r=await fetch('/api/me',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({displayName,about,avatarUrl:avatarUrl||null})});
  if(r.ok){const d=await r.json();me=d.user;closeSheet();toast('Profil disimpan');renderSettings();loadChats();}
  else toast('Gagal simpan');
}
function openChangePassword(){
  openSheet(`<h3>Ganti Password</h3>
    <input id="pCur" type="password" placeholder="Password saat ini">
    <input id="pNew" type="password" placeholder="Password baru (min 6)">
    <button class="btn" onclick="doChangePassword()">Simpan</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Batal</button>`);
}
async function doChangePassword(){
  const current=$('pCur').value,next=$('pNew').value;
  if(!current||!next)return toast('Isi semua');
  if(next.length<6)return toast('Min 6 karakter');
  const r=await fetch('/api/me/password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({current,next})});
  if(r.ok){closeSheet();toast('Password diubah');}
  else toast('Password lama salah');
}
function openPrivacy(){
  openSheet(`<h3>Privasi</h3>
    <div style="color:var(--text-2);font-size:14px;padding:8px 0">EKK CHAT menyimpan data Anda di server kami sendiri (bukan Meta/WhatsApp).</div>
    <button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
async function openBlockedList(){
  const r=await fetch('/api/users/blocked/list',{credentials:'include'});
  const d=await r.json();
  openSheet(`<h3>Kontak diblokir</h3>
    ${(d.blocked||[]).map(u=>`<div class="user-pick">
      ${avHtml(u,'av sm')}
      <div style="flex:1;min-width:0"><div class="name">${esc(u.display_name)}</div></div>
      <button class="chip" onclick="unblockUser(${u.id})">Buka blokir</button>
    </div>`).join('')||'<div style="text-align:center;color:var(--text-2);padding:20px">Belum ada</div>'}
    <button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
async function unblockUser(uid){
  await fetch(`/api/users/${uid}/block`,{method:'DELETE',credentials:'include'});
  toast('Blokir dibuka');openBlockedList();
}
async function openStarredList(){
  const r=await fetch('/api/starred',{credentials:'include'});
  const d=await r.json();
  openSheet(`<h3>Pesan berbintang</h3>
    <div style="max-height:400px;overflow-y:auto">
      ${(d.messages||[]).map(m=>`<div style="padding:10px;border-bottom:1px solid var(--border)">
        <div style="font-size:13px;color:var(--text-2);margin-bottom:4px">${formatTime(m.created_at)}</div>
        <div style="font-size:14px">${esc(m.content||(m.attachment?m.attachment.name:'[media]'))}</div>
      </div>`).join('')||'<div style="text-align:center;color:var(--text-2);padding:20px">Belum ada</div>'}
    </div>
    <button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
function toggleTheme(){
  const isLight=document.documentElement.dataset.theme==='light';
  document.documentElement.dataset.theme=isLight?'dark':'light';
  localStorage.setItem('ekk_theme',isLight?'dark':'light');
  renderSettings();
}
function openAbout(){
  openSheet(`<h3>Tentang EKK CHAT</h3>
    <p style="color:var(--text-2);font-size:14px;line-height:1.5">EKK CHAT adalah aplikasi messenger buatan sendiri. <b>Bukan WhatsApp. Tidak berafiliasi dengan Meta.</b></p>
    <p style="color:var(--text-2);font-size:14px;line-height:1.5">Versi 0.2 — chat realtime, pembaruan status, panggilan (log), pengaturan lengkap.</p>
    <button class="btn btn-ghost" onclick="closeSheet()">Tutup</button>`);
}
async function logout(){
  if(!confirm('Keluar dari EKK CHAT?'))return;
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  if(socket)socket.disconnect();
  location.reload();
}
function openMainMenu(){
  openSheet(`<h3>Menu</h3>
    <div class="menu-row" onclick="closeSheet();openNewChatSheet()">${ICO('search')}<div style="flex:1">Chat baru</div></div>
    <div class="menu-row" onclick="closeSheet();openCreateGroup()">${ICO('users')}<div style="flex:1">Grup baru</div></div>
