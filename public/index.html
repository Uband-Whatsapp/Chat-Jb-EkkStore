<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B141A">
<title>EKK CHAT</title>
<style>
:root{
  --brand:#00A884;--bg:#0B141A;--panel:#111B21;--panel-2:#202C33;
  --text:#E9EDEF;--text-2:#8696A0;--border:#222D34;
  --bubble-out:#005C4B;--bubble-in:#202C33;
  --overlay:rgba(0,0,0,.55);
}
[data-theme="light"]{
  --bg:#EFEAE2;--panel:#FFFFFF;--panel-2:#F0F2F5;
  --text:#111B21;--text-2:#667781;--border:#E9EDEF;
  --bubble-out:#D9FDD3;--bubble-in:#FFFFFF;--overlay:rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit;outline:none}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
.hidden{display:none!important}
.ico{width:24px;height:24px;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico-fill{fill:currentColor;stroke:none}

/* AUTH */
#auth{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0b141a,#0a2e26);padding:24px;gap:14px;z-index:1000}
#auth .logo{font-size:32px;font-weight:800;color:#E9EDEF;margin-bottom:4px;letter-spacing:-.5px}
#auth .tag{color:#8696A0;margin-bottom:16px;font-size:14px;text-align:center}
#auth form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#auth input{padding:14px 16px;border-radius:10px;border:1px solid #223;background:#111b21;color:#E9EDEF;font-size:15px}
#auth input:focus{border-color:var(--brand)}
#auth .btn{padding:14px;border-radius:24px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;margin-top:6px}
#auth .btn:disabled{opacity:.6}
#auth .switch{color:#8696A0;font-size:14px;text-align:center;padding:10px}
#auth .err{color:#F87171;font-size:13px;text-align:center;min-height:18px}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.tab-view{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.tab-view.active{display:flex}
.app-header{background:var(--panel);padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.app-header .title{font-size:20px;font-weight:600;color:var(--brand);flex:1;letter-spacing:-.3px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-btn:active{background:var(--panel-2)}
.icon-btn.brand{background:var(--brand);color:#fff}
.search-wrap{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.search-bar{background:var(--panel-2);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:14px}
.search-bar input{flex:1;background:none;border:0;color:var(--text);font-size:14px;min-width:0}
.search-bar input::placeholder{color:var(--text-2)}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
.list::-webkit-scrollbar{width:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);position:relative;cursor:pointer}
.row:active{background:var(--panel-2)}
.av{width:50px;height:50px;border-radius:50%;flex-shrink:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:40px;height:40px;font-size:15px}
.body{flex:1;min-width:0}
.line1{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.name{font-weight:500;font-size:16px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:12px;color:var(--text-2);flex-shrink:0}
.time.unread{color:var(--brand)}
.line2{display:flex;align-items:center;gap:6px}
.preview{flex:1;font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.badge{background:var(--brand);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 7px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.online-dot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;background:#31A24C;border:2.5px solid var(--panel)}
.empty{padding:60px 30px;text-align:center;color:var(--text-2);font-size:14px}
.empty .ico{width:52px;height:52px;stroke-width:1.5;margin-bottom:14px;opacity:.5}

/* NAV */
.nav{background:var(--panel);border-top:1px solid var(--border);display:flex;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom)) 0;flex-shrink:0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;color:var(--text-2);font-size:11px;font-weight:500;position:relative}
.nav button.active{color:var(--brand)}
.nav button .ico{width:22px;height:22px}
.nav button.active .ico{stroke-width:2.4}
.nav-badge{position:absolute;top:-2px;right:calc(50% - 22px);background:var(--brand);color:#fff;
  font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;padding:0 4px;
  display:flex;align-items:center;justify-content:center}

/* CONVO */
#convo{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#convo.open{display:flex}
#convo::before{content:"";position:absolute;inset:0;background-image:
  repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 20px);
  pointer-events:none;z-index:-1}
.convo-header{background:var(--panel);padding:8px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border);z-index:2}
.convo-header .back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
.convo-header .back:active{background:var(--panel-2)}
.convo-header .info{flex:1;min-width:0}
.convo-header .n{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo-header .s{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:16px}
#messages{flex:1;overflow-y:auto;padding:12px 8px 8px;-webkit-overflow-scrolling:touch;z-index:1}
#messages::-webkit-scrollbar{width:0}
.msg{max-width:82%;margin-bottom:6px;display:flex;flex-direction:column;position:relative}
.msg.me{align-items:flex-end;margin-left:auto}
.bubble{padding:7px 10px 6px;border-radius:8px;position:relative;word-wrap:break-word;overflow-wrap:break-word;
  font-size:15px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.15);animation:msgIn .18s ease-out;max-width:100%}
.msg.them .bubble{background:var(--bubble-in);border-top-left-radius:2px;color:var(--text)}
.msg.me .bubble{background:var(--bubble-out);border-top-right-radius:2px}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bubble .content{white-space:pre-wrap;word-break:break-word}
.bubble .attach-img{max-width:260px;max-height:280px;border-radius:6px;margin:-2px -2px 4px;display:block;cursor:pointer}
.bubble .attach-file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.15);padding:10px;border-radius:6px;margin:-2px -2px 4px;min-width:200px}
.bubble .attach-file .fico{width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble .attach-file .fname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble .attach-file .fsize{font-size:11px;opacity:.7}
.bubble .reply-preview{border-left:3px solid var(--brand);padding:5px 8px;background:rgba(0,0,0,.15);border-radius:4px;margin:-2px -2px 4px;font-size:13px;max-width:100%;overflow:hidden}
.bubble .reply-preview .rp-name{font-weight:600;color:var(--brand);margin-bottom:2px}
.bubble .reply-preview .rp-text{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble .meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px;font-size:11px;color:var(--text-2)}
.msg.me .bubble .meta{color:rgba(233,237,239,.7)}
[data-theme="light"] .msg.me .bubble .meta{color:#667781}
.bubble .check{display:inline-flex;align-items:center}
.bubble .check .ico{width:15px;height:15px;stroke-width:2.5;color:#53BDEB}
.bubble.deleted{opacity:.6;font-style:italic}
.msg.sender-name{font-size:12.5px;font-weight:600;padding:0 12px 2px;margin-top:-2px}

/* COMPOSER */
.composer{background:var(--panel);padding:6px 8px calc(6px + env(safe-area-inset-bottom)) 8px;
  display:flex;align-items:flex-end;gap:4px;flex-shrink:0;z-index:2}
.composer .icon-btn{width:40px;height:40px}
.input-wrap{flex:1;background:var(--panel-2);border-radius:22px;padding:6px 6px 6px 14px;display:flex;align-items:flex-end;gap:4px}
.composer textarea{flex:1;background:none;border:0;padding:6px 0;resize:none;max-height:120px;
  font-size:15px;color:var(--text);line-height:1.35;min-height:24px;font-family:inherit}
.composer textarea::placeholder{color:var(--text-2)}
.send-btn{background:var(--brand);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,168,132,.4)}
.send-btn:active{transform:scale(.93)}
.send-btn .ico{width:20px;height:20px}

/* REPLY BAR */
.reply-bar{background:var(--panel-2);padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.reply-bar .rb-line{width:3px;height:34px;background:var(--brand);border-radius:2px;flex-shrink:0}
.reply-bar .rb-body{flex:1;min-width:0;font-size:13px}
.reply-bar .rb-name{color:var(--brand);font-weight:600;margin-bottom:2px}
.reply-bar .rb-text{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* RING */
.my-status{display:flex;align-items:center;gap:12px;padding:14px}
.my-status .av{width:50px;height:50px;background:var(--panel-2);color:var(--text-2)}
.my-status .plus{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)}
.my-status .plus .ico{width:12px;height:12px;stroke-width:3}
.section-title{padding:12px 16px 4px;font-size:13px;color:var(--brand);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.ring{width:50px;height:50px;border-radius:50%;padding:2.5px;flex-shrink:0;background:linear-gradient(45deg,#00A884,#06CF9C)}
.ring.viewed{background:var(--text-2)}
.ring .inner{width:100%;height:100%;border-radius:50%;background:var(--panel);padding:2px;display:flex}
.ring .inner .av{width:100%;height:100%}

/* SETTINGS */
.settings-profile{display:flex;align-items:center;gap:14px;padding:18px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-profile:active{background:var(--panel-2)}
.settings-profile .av{width:64px;height:64px;font-size:24px}
.settings-profile .info{flex:1;min-width:0}
.settings-profile .n{font-size:19px;font-weight:500;margin-bottom:2px}
.settings-profile .a{font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-section{padding:8px 0;border-bottom:8px solid var(--panel-2)}
.setting-row{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer}
.setting-row:active{background:var(--panel-2)}
.setting-row .ico{color:var(--text-2)}
.setting-row .label{flex:1;font-size:16px}
.setting-row .value{font-size:14px;color:var(--text-2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setting-row.danger .label{color:#F87171}

/* SHEET */
.sheet-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-backdrop.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;
  animation:sheetIn .22s ease-out;max-height:88vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 14px;font-size:17px;font-weight:600}
.sheet input,.sheet textarea{width:100%;padding:12px 14px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit}
.sheet textarea{resize:vertical;min-height:80px}
.sheet .btn{padding:12px;border-radius:24px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;width:100%;margin-top:6px}
.sheet .btn-ghost{background:var(--panel-2);color:var(--text);margin-top:8px}
.sheet .menu-row{display:flex;align-items:center;gap:14px;padding:12px 8px;cursor:pointer;border-radius:8px}
.sheet .menu-row:active{background:var(--panel-2)}
.sheet .menu-row.danger{color:#F87171}
.sheet .color-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sheet .color-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sheet .color-dot.on{border-color:#fff}
.sheet .user-pick{display:flex;align-items:center;gap:12px;padding:10px 8px;cursor:pointer;border-radius:8px}
.sheet .user-pick:active{background:var(--panel-2)}
.sheet .user-pick.on{background:rgba(0,168,132,.12)}
.sheet .cb{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet .user-pick.on .cb{background:var(--brand);border-color:var(--brand)}
.sheet .user-pick.on .cb .ico{width:14px;height:14px;color:#fff;stroke-width:3}

/* EMOJI PICKER */
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.emoji-grid button{font-size:24px;padding:6px;border-radius:8px;text-align:center;line-height:1}
.emoji-grid button:active{background:var(--panel-2)}

/* STATUS VIEWER */
.status-viewer{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column}
.status-viewer.open{display:flex}
.status-progress{display:flex;gap:3px;padding:10px 12px 0;flex-shrink:0}
.status-progress .bar{flex:1;height:2.5px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.status-progress .bar .fill{height:100%;width:0%;background:#fff}
.status-progress .bar.done .fill{width:100%}
.status-header{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;flex-shrink:0}
.status-header .av{width:40px;height:40px}
.status-header .meta{flex:1;min-width:0}
.status-header .n{font-weight:600;font-size:15px}
.status-header .t{font-size:12px;opacity:.7}
.status-header .x{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff}
.status-body{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;
  color:#fff;font-size:26px;font-weight:600;line-height:1.3;word-break:break-word}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);
  color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:999;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* IMAGE FULLSCREEN */
#imgView{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
#imgView.open{display:flex}
#imgView img{max-width:100%;max-height:100%;object-fit:contain}

@media(min-width:768px){
  #app{max-width:600px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  #convo{max-width:600px;left:50%;transform:translateX(-50%)}
}
</style>
</head>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>

  <symbol id="i-attach" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-check-2" viewBox="0 0 24 24"><path d="m2 12 5 5L18 6"/><path d="m12 17 8-8"/></symbol>

<script src="/socket.io/socket.io.js"></script>
<script>
// ============ STATE ============
let me=null,socket=null,currentChat=null,typingTO=null,lastTyping=0,chatTimer=null,statusTimer=null,statusIdx=0,statusList=[],pendingReply=null;
const $=id=>document.getElementById(id);
const svgIco=(name,cls='ico')=>`<svg class="${cls}"><use href="#i-${name}"/></svg>`;

function toast(m,d=2200){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),d);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTime(iso){if(!iso)return'';const d=new Date(iso),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const df=(n-d)/86400000;if(df<1)return'Kemarin';
  if(df<7)return d.toLocaleDateString([],{weekday:'short'});
  return d.toLocaleDateString([],{day:'2-digit',month:'2-digit',year:'2-digit'});}
function avatarHtml(u,cls='av'){
  if(!u)return `<div class="${cls}">?</div>`;
  const init=(u.display_name||'?')[0].toUpperCase();
  const src=u.avatar_url?`<img src="${escapeHtml(u.avatar_url)}" alt="">`:init;
  return `<div class="${cls}">${src}</div>`;
}

// ============ AUTH ============
let authMode='login';
function setAuthMode(m){authMode=m;const r=m==='register';
  $('a_name').style.display=r?'block':'none';
  $('authBtn').textContent=r?'Daftar':'Masuk';
  $('authSwitch').textContent=r?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';
  $('authTag').textContent=r?'Buat akun baru untuk mulai chat':'Masuk atau daftar untuk mulai chat';
  $('authErr').textContent='';}
$('authSwitch').onclick=()=>setAuthMode(authMode==='login'?'register':'login');
$('authForm').onsubmit=async e=>{
  e.preventDefault();$('authErr').textContent='';
  const u=$('a_user').value.trim().toLowerCase(),p=$('a_pass').value,n=$('a_name').value.trim();
  if(!u||!p){$('authErr').textContent='Isi semua dulu';return;}
  if(authMode==='register'&&!n){$('authErr').textContent='Nama wajib diisi';return;}
  $('authBtn').disabled=true;
  try{
    const url=authMode==='login'?'/api/login':'/api/register';
    const body=authMode==='login'?{username:u,password:p}:{username:u,password:p,displayName:n};
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){$('authErr').textContent=mapErr(d.error);return;}
    me=d.user;startApp();
  }catch{$('authErr').textContent='Koneksi gagal';}
  finally{$('authBtn').disabled=false;}
};
function mapErr(c){return({missing_field:'Isi semua',too_short:'Username min 3, password min 6',username_taken:'Username sudah dipakai',invalid:'Username atau password salah',db_error:'Server bermasalah'})[c]||'Terjadi kesalahan';}

// ============ BOOT ============
async function tryAutoLogin(){try{const r=await fetch('/api/me',{credentials:'include'});if(r.ok){const d=await r.json();me=d.user;startApp();return;}}catch{}$('auth').classList.remove('hidden');}
function startApp(){
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  connectSocket();loadChats();loadUpdates();loadCalls();renderSettings();
  setInterval(()=>{if(socket)socket.emit('heartbeat');},30000);
}

// ============ NAV ============
document.querySelectorAll('.nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
    document.querySelector(`.tab-view[data-tab="${b.dataset.tab}"]`).classList.add('active');
    if(b.dataset.tab==='updates')loadUpdates();
    if(b.dataset.tab==='calls')loadCalls();
    if(b.dataset.tab==='settings')renderSettings();
  };
});

// ============ SOCKET ============
function connectSocket(){
  socket=io({withCredentials:true});
  socket.on('message:new',msg=>{
    if(currentChat){
      const isCur = currentChat.kind==='group'
        ? msg.group_id===currentChat.id
        : (msg.sender_id===currentChat.id||msg.recipient_id===currentChat.id) &&
          (msg.sender_id===me.id||msg.recipient_id===me.id);
      if(isCur){appendMessage(msg);}
    }
    loadChats();
  });
  socket.on('message:deleted',({id})=>{
    const el=document.getElementById('m_'+id);
    if(el){const c=el.querySelector('.content');
      if(c){c.innerHTML='<i>Pesan ini telah dihapus</i>';el.querySelector('.bubble')?.classList.add('deleted');}}
    loadChats();
  });
  socket.on('typing',({from,isTyping})=>{
    if(!currentChat)return;
    if(currentChat.kind!=='group'&&from!==currentChat.id)return;
    if(isTyping){
      $('cStatus').textContent='sedang mengetik…';
      clearTimeout(typingTO);typingTO=setTimeout(updateConvoStatus,3500);
    }else updateConvoStatus();
  });
  socket.on('status:new',loadUpdates);
  socket.on('group:new',loadChats);
  socket.on('call:new',loadCalls);
}

// ============ CHAT LIST ============
async function loadChats(){
  try{
    const r=await fetch('/api/chats',{credentials:'include'});
    const d=await r.json();
    const list=$('chatsList');
    if(!d.chats||!d.chats.length){
      list.innerHTML=`<div class="empty">${svgIco('chat')}<div>Belum ada chat.<br>Tap ikon cari untuk mulai.</div></div>`;
      updateNavUnread(0);return;
    }
    let total=0;
    list.innerHTML=d.chats.map(c=>{
      total+=c.unread||0;
      if(c.kind==='group'){
        return `<div class="row" onclick='openGroup(${c.id},"${escapeHtml(c.name).replace(/"/g,'&quot;')}")'>
          ${avatarHtml({display_name:c.name,avatar_url:null})}
          <div class="body">
            <div class="line1"><div class="name">${escapeHtml(c.name)}</div><div class="time">${formatTime(c.lastTime)}</div></div>
            <div class="line2"><div class="preview">${c.lastMessage?escapeHtml(c.lastMessage).slice(0,50):'Grup baru'}</div></div>
          </div>
        </div>`;
      }
      const u=c.user;
      const dot=u.is_online?'<span class="online-dot"></span>':'';
      const preview=c.hasAtt?'<svg class="ico" style="width:14px;height:14px"><use href="#i-image"/></svg> '+escapeHtml(c.lastMessage||'').slice(0,45):escapeHtml(c.lastMessage||'').slice(0,55);
      return `<div class="row" onclick='openChat(${JSON.stringify(JSON.stringify(u))})'>
        <div style="position:relative">${avatarHtml(u)}${dot}</div>
        <div class="body">
          <div class="line1"><div class="name">${escapeHtml(u.display_name)}</div><div class="time ${c.unread>0?'unread':''}">${formatTime(c.lastTime)}</div></div>
          <div class="line2"><div class="preview">${preview||'<i>Mulai percakapan</i>'}</div>
            ${c.unread>0?`<div class="badge">${c.unread}</div>`:''}</div>
        </div>
      </div>`;
    }).join('');
    updateNavUnread(total);
  }catch(e){console.error(e);}
}
function updateNavUnread(n){const b=$('navUnread');if(n>0){b.textContent=n>99?'99+':n;b.classList.remove('hidden');}else b.classList.add('hidden');}
$('chatSearch').oninput=()=>{
  clearTimeout(chatTimer);chatTimer=setTimeout(async()=>{
    const q=$('chatSearch').value.trim();
    if(!q){loadChats();return;}
    const r=await fetch('/api/users?q='+encodeURIComponent(q),{credentials:'include'});
    const d=await r.json();
    const list=$('chatsList');
    if(!d.users.length){list.innerHTML=`<div class="empty">${svgIco('search')}<div>Tidak ada user ditemukan</div></div>`;return;}
    list.innerHTML=d.users.map(u=>`<div class="row" onclick='openChat(${JSON.stringify(JSON.stringify(u))})'>
      ${avatarHtml(u)}
      <div class="body">
        <div class="line1"><div class="name">${escapeHtml(u.display_name)}</div></div>
        <div class="line2"><div class="preview">@${escapeHtml(u.username)} — ${escapeHtml(u.about||'')}</div></div>
      </div>
    </div>`).join('');
  },250);
};

// ============ CONVERSATION ============
function openChat(json){
  const u=JSON.parse(json);
  currentChat={...u,kind:'user'};pendingReply=null;hideReplyBar();
  $('cName').textContent=u.display_name;
  updateConvoStatus();
  $('cAv').innerHTML=u.avatar_url?`<img src="${escapeHtml(u.avatar_url)}" alt="">`:(u.display_name||'?')[0].toUpperCase();
  $('convo').classList.add('open');
  $('messages').innerHTML='<div style="text-align:center;color:var(--text-2);padding:20px;font-size:13px">Memuat…</div>';
  fetch(`/api/messages/${u.id}`,{credentials:'include'}).then(r=>r.json()).then(d=>{
    renderMessages(d.messages);
  });
  setTimeout(()=>$('msgInput').focus(),250);
}
function openGroup(id,name){
  currentChat={id,kind:'group',display_name:name};pendingReply=null;hideReplyBar();
  $('cName').textContent=name;
  $('cStatus').textContent='memuat anggota…';
  $('cAv').innerHTML=(name||'?')[0].toUpperCase();
  $('convo').classList.add('open');
  $('messages').innerHTML='<div style="text-align:center;color:var(--text-2);padding:20px;font-size:13px">Memuat…</div>';
  fetch(`/api/groups/${id}/members`,{credentials:'include'}).then(r=>r.json()).then(d=>{
    const names=(d.members||[]).map(m=>m.display_name).join(', ');
    $('cStatus').textContent=names||'';
  });
  fetch(`/api/messages/group/${id}`,{credentials:'include'}).then(r=>r.json()).then(d=>{
    renderMessages(d.messages);
  });
  setTimeout(()=>$('msgInput').focus(),250);
}
function closeConvo(){$('convo').classList.remove('open');currentChat=null;loadChats();}
function updateConvoStatus(){
  if(!currentChat)return;
  if(currentChat.kind==='group')return;
  const u=currentChat;
  $('cStatus').textContent=u.is_online?'online':(u.last_seen?'terakhir dilihat '+formatTime(u.last_seen):'');
}
function renderMessages(msgs){
  const m=$('messages');m.innerHTML='';
  if(!msgs||!msgs.length){m.innerHTML='<div style="text-align:center;color:var(--text-2);padding:30px 20px;font-size:13px">Belum ada pesan. Mulai ngobrol!</div>';return;}
  msgs.forEach(renderMessage);
  scrollBottom();
}
function renderMessage(msg){
  const mine=msg.sender_id===me.id;
  const div=document.createElement('div');
  div.className='msg '+(mine?'me':'them');div.id='m_'+msg.id;
  if(msg.deleted){div.innerHTML=`<div class="bubble deleted"><div class="content"><i>Pesan ini telah dihapus</i></div></div>`;m_append(div);return;}
  let attachHtml='';
  if(msg.attachment){
    const a=msg.attachment;
    if(a.kind==='image'){
      attachHtml=`<img class="attach-img" src="${a.data}" onclick="viewImage('${a.data.replace(/'/g,'\\\'')}')" alt="">`;
    }else{
      const size=a.size?fmtSize(a.size):'';
      attachHtml=`<a class="attach-file" href="${a.data}" download="${escapeHtml(a.name)}">
        <div class="fico">${svgIco('file')}</div>
        <div style="min-width:0"><div class="fname">${escapeHtml(a.name)}</div><div class="fsize">${size}</div></div>
      </a>`;
    }
  }
  let replyHtml='';
  if(msg.reply_to_id&&msg._reply){
    replyHtml=`<div class="reply-preview"><div class="rp-name">${escapeHtml(msg._reply.name)}</div><div class="rp-text">${escapeHtml(msg._reply.text).slice(0,80)}</div></div>`;
  }
  const time=new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const check=mine?(msg.read_at?`<span class="check">${svgIco('check-2')}</span>`:`<span class="check" style="opacity:.6">${svgIco('check')}</span>`):'';
  let senderName='';
  if(!mine&&currentChat&&currentChat.kind==='group'){
    senderName=`<div class="sender-name" style="color:${nameColor(msg.sender_id)}">User ${msg.sender_id}</div>`;
  }
  div.innerHTML=`${senderName}<div class="bubble" data-mid="${msg.id}">
    ${replyHtml}${attachHtml}
    ${msg.content?`<div class="content">${linkify(escapeHtml(msg.content))}</div>`:''}
    <div class="meta"><span>${time}</span>${check}</div>
  </div>`;
  const bub=div.querySelector('.bubble');
  let pressTimer;
  const start=()=>{pressTimer=setTimeout(()=>{openMsgMenu(msg);},500);};
  const cancel=()=>{clearTimeout(pressTimer);};
  bub.addEventListener('touchstart',start);bub.addEventListener('touchend',cancel);bub.addEventListener('touchmove',cancel);
  bub.addEventListener('contextmenu',e=>{e.preventDefault();openMsgMenu(msg);});
  m_append(div);
}
function m_append(el){$('messages').appendChild(el);scrollBottom();}
function appendMessage(msg){
  const em=$('messages').querySelector('.empty');if(em)$('messages').innerHTML='';
  renderMessage(msg);
}
function scrollBottom(){const el=$('messages');requestAnimationFrame(()=>el.scrollTop=el.scrollHeight);}
function linkify(t){return t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');}
function nameColor(id){const c=['#53BDEB','#E542A3','#F5C33B','#7FD97A','#F0716A','#B47DFF'];return c[id%c.length];}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}

// ============ COMPOSER ============
const ta=$('msgInput');
ta.oninput=()=>{
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  if(!socket||!currentChat)return;
  const now=Date.now();
  if(now-lastTyping>1500){
    socket.emit('typing',currentChat.kind==='group'?{groupId:currentChat.id,isTyping:true}:{to:currentChat.id,isTyping:true});
    lastTyping=now;
    setTimeout(()=>{if(socket&&currentChat)socket.emit('typing',currentChat.kind==='group'?{groupId:currentChat.id,isTyping:false}:{to:currentChat.id,isTyping:false});},2500);
  }
};
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
$('sendBtn').onclick=sendMsg;
function sendMsg(){
  const text=ta.value.trim();
  if(!text||!currentChat||!socket)return;
  const payload={content:text,replyTo:pendingReply?.id||null};
  if(currentChat.kind==='group')payload.groupId=currentChat.id;else payload.to=currentChat.id;
  socket.emit('message:send',payload);
  ta.value='';ta.style.height='auto';cancelReply();
}

function pickFile(accept){
  closeSheet();
  const inp=$('fileInput');
  inp.accept=accept;
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>2*1024*1024){toast('Maks 2MB');inp.value='';return;}
    const reader=new FileReader();
    reader.onload=async()=>{
      const data=reader.result;
      const isImg=f.type.startsWith('image/');
      const attachment={kind:isImg?'image':'file',mime:f.type,name:f.name,size:f.size,data};
      if(!socket||!currentChat)return;
      const payload={attachment,content:'',replyTo:pendingReply?.id||null};
      if(currentChat.kind==='group')payload.groupId=currentChat.id;else payload.to=currentChat.id;
      socket.emit('message:send',payload);
      cancelReply();
    };
    reader.readAsDataURL(f);
    inp.value='';
  };
  inp.click();
}

async function loadUpdates(){
  const r=await fetch('/api/statuses',{credentials:'include'});
  const d=await r.json();
  const list=$('updatesList');
  const mine=d.statuses.filter(s=>s.user_id===me.id);
  const others=d.statuses.filter(s=>s.user_id!==me.id);
  let html='';
  html+=`<div class="my-status" onclick="openStatusSheet()">
    <div style="position:relative">${avatarHtml(me,'av')}<span class="plus">${svgIco('plus')}</span></div>
    <div style="flex:1"><div style="font-weight:500">Status saya</div><div style="font-size:13px;color:var(--text-2)">${mine.length?'Ketuk untuk lihat':'Ketuk untuk tambah pembaruan'}</div></div>
  </div>`;
  if(others.length){
    html+='<div class="section-title">Pembaruan terbaru</div>';
    const byUser={};
    others.forEach(s=>{(byUser[s.user_id]||(byUser[s.user_id]={user:s,items:[]})).items.push(s);});
    Object.values(byUser).forEach(({user,items})=>{
      const latest=items[0];
      const viewed=items.every(i=>i.viewed_by_me);
      html+=`<div class="row" onclick='viewUserStatus(${user.user_id})'>
        <div class="ring ${viewed?'viewed':''}"><div class="inner">${avatarHtml(user)}</div></div>
        <div class="body">
          <div class="line1"><div class="name">${escapeHtml(user.display_name)}</div><div class="time">${formatTime(latest.created_at)}</div></div>
          <div class="line2"><div class="preview">${items.length} pembaruan</div></div>
        </div>
      </div>`;
    });
  }else{
    html+=`<div class="empty">${svgIco('status')}<div>Belum ada pembaruan dari kontak lain.</div></div>`;
  }
  list.innerHTML=html;
}
function openStatusSheet(){
  const colors=['#00A884','#0F5E51','#3B82F6','#8B5CF6','#EC4899','#F59E0B','#EF4444','#111B21'];
  openSheet(`<h3>Buat pembaruan status</h3>
    <textarea id="stText" placeholder="Ketik status..." maxlength="700"></textarea>
    <div class="color-row" id="stColors">${colors.map((c,i)=>`<div class="color-dot ${i===0?'on':''}" data-c="${c}" style="background:${c}" onclick="pickColor(this)"></div>`).join('')}</div>
    <button class="btn" onclick="postStatus()">Bagikan</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Batal</button>`);
}
function pickColor(el){document.querySelectorAll('#stColors .color-dot').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
async function postStatus(){
  const content=$('stText').value.trim();
  if(!content)return toast('Isi status dulu');
  const bgColor=document.querySelector('#stColors .on')?.dataset.c||'#00A884';
  const r=await fetch('/api/statuses',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({content,bgColor})});
  if(r.ok){closeSheet();toast('Status dibagikan');loadUpdates();}
  else toast('Gagal share status');
}
function viewUserStatus(uid){
  fetch('/api/statuses',{credentials:'include'}).then(r=>r.json()).then(d=>{
    const items=d.statuses.filter(s=>s.user_id===uid).reverse();
    if(!items.length)return;
    statusList=items;statusIdx=0;
    $('statusViewer').classList.add('open');
    showStatus();
  });
}
function showStatus(){
  if(statusIdx>=statusList.length){closeStatusViewer();return;}
  const s=statusList[statusIdx];
  $('svName').textContent=s.display_name;
  $('svTime').textContent=formatTime(s.created_at);
  $('svAv').innerHTML=s.avatar_url?`<img src="${escapeHtml(s.avatar_url)}">`:(s.display_name||'?')[0].toUpperCase();
  $('svBody').style.background=s.bg_color||'#00A884';
  $('svBody').textContent=s.content;
  $('statusProgress').innerHTML=statusList.map((_,i)=>`<div class="bar ${i<statusIdx?'done':''}"><div class="fill" style="${i===statusIdx?'width:0%':''}"></div></div>`).join('');
  const fill=$('statusProgress').children[statusIdx]?.querySelector('.fill');
  if(fill){fill.style.transition='width 5s linear';requestAnimationFrame(()=>{fill.style.width='100%';});}
  fetch(`/api/statuses/${s.id}/view`,{method:'POST',credentials:'include'}).catch(()=>{});
  clearTimeout(statusTimer);statusTimer=setTimeout(nextStatus,5200);
}
function nextStatus(){statusIdx++;showStatus();}
function closeStatusViewer(){clearTimeout(statusTimer);$('statusViewer').classList.remove('open');statusList=[];statusIdx=0;loadUpdates();}

async function loadCalls(){
  const r=await fetch('/api/calls',{credentials:'include'});
  const d=await r.json();
  const list=$('callsList');
  if(!d.calls.length){list.innerHTML=`<div class="empty">${svgIco('phone')}<div>Belum ada riwayat panggilan</div></div>`;return;}
  list.innerHTML=d.calls.map(c=>{
    const arrow=c.direction==='incoming'?svgIco('phone'):svgIco('phone');
    const missed=c.status==='missed';
    return `<div class="row">
      ${avatarHtml(c.user)}
      <div class="body">
        <div class="line1"><div class="name" style="${missed?'color:#F87171':''}">${escapeHtml(c.user?.display_name||'Unknown')}</div><div class="time">${formatTime(c.created_at)}</div></div>
        <div class="line2"><div class="preview" style="display:flex;align-items:center;gap:6px">
          ${c.direction==='incoming'?'↙':'↗'} ${c.type==='video'?'Video':'Suara'}${missed?' • tidak terjawab':''}
        </div></div>
      </div>
      <button class="icon-btn" onclick='callFromHistory(${c.user?.id})' aria-label="Panggil">${svgIco('phone')}</button>
    </div>`;
  }).join('');
}
function callFromHistory(uid){
  if(!uid)return;

  fetch('/api/calls',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',

}

// ============ SHEET ============
function openSheet(html){$('sheet').innerHTML=html;$('sheetBackdrop').classList.add('open');}
function closeSheet(e){if(e&&e.target&&e.target.id!=='sheetBackdrop')return;$('sheetBackdrop').classList.remove('open');}

// ============ BOOT ============
if(localStorage.getItem('ekk_theme'))document.documentElement.dataset.theme=localStorage.getItem('ekk_theme');
setAuthMode('login');
tryAutoLogin();
